# Managed by trueup. Edit trueup.toml, then run the trueup skill.
repos:
  - repo: local
    hooks:
      - id: ref-check
        name: ref_check
        entry: trueup refs --root .
        language: system
        pass_filenames: false
      - id: gitleaks
        name: 'gitleaks secret scan'
        entry: 'sh -c ''command -v gitleaks >/dev/null 2>&1 || { echo "gitleaks not on the path: secret scan skipped"; exit 0; }; exec gitleaks git --pre-commit --staged --redact --no-banner --config lint/gitleaks/gitleaks.toml'''
        language: system
        pass_filenames: false
      - id: golangci-lint
        name: 'golangci-lint'
        entry: 'golangci-lint run -c lint/go/golangci.yml ./...'
        language: system
        pass_filenames: false
      - id: vale
        name: 'vale prose check'
        entry: 'vale --config lint/vale/.vale.ini'
        language: system
        types_or: [markdown, python, rust, ts, tsx, javascript, jsx, go, php]
        exclude: '^(?:internal/mime/html\.go)$|^(?:docs/features/.*)$'

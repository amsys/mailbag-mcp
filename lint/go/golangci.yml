# Managed by trueup. Edit trueup.toml, then run the trueup skill.
# golangci-lint v2 config, clean mode: the standard linter set (which
# holds `unused` for dead code) plus the comment standard: revive's
# exported and package-comments rules for doc comments, nolintlint so
# each nolint directive names a linter and gives a reason, and gosec for
# SAST (D7.5). The standard set does not enable gosec on its own.
version: "2"
linters:
  default: standard
  enable: [revive, nolintlint, gosec]
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
        - name: package-comments
formatters:
  enable: [gofmt]

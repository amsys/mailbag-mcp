# Managed by trueup. Edit trueup.toml, then run the trueup skill.
# Vale entry point (S6). Markdown gets the full Trueup style, including
# spelling; a source-comment file gets only the banned-word rule, because
# Vale.Spelling has no idea which words are identifiers. Markdown's own
# spelling rule runs at warning, not error (LOW-10): the check's
# MinAlertLevel of error then still fails on a banned word, but not on a
# product name or an identifier the ten-word vocabulary lacks.
# The Markdown BlockIgnores holds the quoted-list rule of trueup check
# (D8.4): a list item or paragraph with a cue such as "banned" or "never
# use" in its first three lines states a rule, so its words are not
# alerts. Vale runs this section on a backtracking engine, so the cue
# window is bounded; an unbounded form took minutes on a long page.
# The source section names the eight extensions Vale lexes as code, so
# that only their comments are read (D8.6). Vale reads .mjs, .cjs, .mts,
# .cts, .sh, .sql and .vue as plain text, string literals included, and
# no setting changes that; the prose row of trueup check covers them.

StylesPath = styles
MinAlertLevel = error
Vocab = Trueup

[*.md]
BasedOnStyles = Vale, Trueup
Vale.Spelling = warning
BlockIgnores = (?im)^[ \t]*(?:[-*+]|\d+[.)])[ \t]+(?:[^\n]*\n[ \t]+)?(?:[^\n]*\n[ \t]+)?[^\n]*?\b(?:banned|never use|do not use|don't use|forbidden|prohibited|not allowed)\b(?:[^\n]|\n[ \t]+|\n[ \t]*\n[ \t]+)*, (?im)^(?:\b(?:banned|never use|do not use|don't use|forbidden|prohibited|not allowed)\b|(?:[^\s\-*+#>|]|[-*+][^\s])(?:[^\n]*\n[ \t]*(?=[^\s#>|]))?(?:[^\n]*\n[ \t]*(?=[^\s#>|]))?[^\n]*?\b(?:banned|never use|do not use|don't use|forbidden|prohibited|not allowed)\b)(?:[^\n]|\n[ \t]+|\n[^\s#>|])*

[*.{py,rs,ts,tsx,js,jsx,go,php}]
BasedOnStyles = Trueup
Vale.Spelling = NO

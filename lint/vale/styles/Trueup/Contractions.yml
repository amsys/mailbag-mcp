# Managed by trueup. Edit trueup.toml, then run the trueup skill.
# A suggestion: spell a contraction out, so a reader who is not a fluent
# English speaker still follows the sentence (S6).
extends: substitution
message: "Spell out '%s' as '%s'."
level: suggestion
ignorecase: true
swap:
  isn't: is not
  aren't: are not
  wasn't: was not
  weren't: were not
  hasn't: has not
  haven't: have not
  hadn't: had not
  doesn't: does not
  don't: do not
  didn't: did not
  won't: will not
  wouldn't: would not
  can't: cannot
  couldn't: could not
  shouldn't: should not
  it's: it is
  that's: that is
  there's: there is

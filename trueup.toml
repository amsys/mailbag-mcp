# trueup configuration. The trueup skill writes this file. A person can edit it.
version = 1
run_date = "2026-10-16"
tier = "auto"                # auto | T0 | T1 | T2 | T3
public = true                # true adds C1, C2 and the public health files
docs = "auto"                # auto | full | readme
stale_days = 180                # P8
ignore = ["docs/features/**"]   # globs left out of the survey and all findings
protect = []                 # globs that apply never changes or removes

[root]
allow = ["cmd"]              # root entries allowed beyond the base list (D5.8); cmd/ holds mailbag-setup (SQ13.2)

[scratch]
allow = []                   # paths or names the scratch rule lets through (D5.8)

[languages]                  # one key per language: strict | clean | off
shell = "off"
go = "clean"
typescript = "clean"

